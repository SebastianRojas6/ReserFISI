services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: reserfisi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reserfisi_local}
      POSTGRES_DB: reserfisi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reserfisi -d reserfisi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
